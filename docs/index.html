<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC Continuous Count Stations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --ground:#12171d;--panel:#1a2129;--panel-2:#212a34;--line:#2c3743;
    --ink:#e6edf3;--ink-dim:#8b97a4;--ink-faint:#5b6672;
    --s0:#4d9fff;--s1:#7ac0f5;--s2:#9aa7b4;--s3:#ffb43d;--s4:#ff5c3d;
    --s5:#c39bff;--s6:#4a5561;--accent:#5aa9d6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:"Barlow Semi Condensed",-apple-system,system-ui,sans-serif;
    display:grid;grid-template-columns:1fr 390px;grid-template-rows:auto auto 1fr;
    grid-template-areas:"head head" "sub sub" "map panel";height:100vh;overflow:hidden}
  header{grid-area:head;display:flex;align-items:baseline;gap:16px;padding:13px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
  header .sub{color:var(--ink-dim);font-size:12px;letter-spacing:.05em}
  header .gen{margin-left:auto;color:var(--ink-faint);font-size:11px;font-family:ui-monospace,monospace}
  .strip{grid-area:sub;display:flex;align-items:center;gap:14px;padding:9px 20px;
    background:var(--panel-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .strip .datebox{display:flex;align-items:center;gap:7px}
  .strip input[type=date]{background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:5px 9px;font-family:inherit;font-size:13px}
  .strip input[type=range]{flex:1;min-width:160px;accent-color:var(--accent)}
  .nav-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:15px}
  .nav-btn:hover{background:var(--line)}
  .play{background:var(--accent);color:#0d1116;border:none;border-radius:6px;
    width:30px;height:30px;cursor:pointer;font-size:12px}
  .summary{display:flex;gap:13px;font-size:12px;color:var(--ink-dim);white-space:nowrap}
  .summary b{color:var(--ink);font-family:ui-monospace,monospace}
  .summary i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
  #map{grid-area:map;background:#0d1116}
  .leaflet-container{background:#0d1116}
  aside{grid-area:panel;background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .filters{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .filters .row{display:flex;gap:8px;align-items:center}
  .filters label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);width:48px;flex:none}
  select{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
    border-radius:6px;padding:6px 9px;font-family:inherit;font-size:13px;flex:1}
  .count{font-size:11.5px;color:var(--ink-dim)}
  .legend{padding:9px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 11px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-dim)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .detail{padding:16px;overflow:auto;flex:1}
  .unusual h4,.detail h4{margin:0 0 8px;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-faint);font-weight:500}
  .urow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
  .urow:hover{color:var(--accent)}
  .urow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .urow .pc{font-family:ui-monospace,monospace;font-size:12px}
  .empty{color:var(--ink-faint);font-size:13px;line-height:1.6}
  .st-name{font-size:18px;font-weight:600;line-height:1.25;margin:0 0 3px}
  .st-meta{color:var(--ink-dim);font-size:12px;margin-bottom:12px}
  .st-meta b{color:var(--ink)}
  .headline{display:flex;align-items:flex-end;gap:12px;padding:12px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .headline .big{font-size:34px;font-weight:600;line-height:.9;font-family:ui-monospace,monospace}
  .headline .status{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding-bottom:4px}
  .vs{color:var(--ink-dim);font-size:12.5px;margin-top:9px;line-height:1.8}
  .vs .num{color:var(--ink);font-family:ui-monospace,monospace}
  .vs .up{color:var(--s3)}.vs .down{color:var(--s1)}
  a.btn{display:inline-block;margin-top:12px;background:var(--accent);color:#0d1116;
    text-decoration:none;font-weight:600;font-size:13px;padding:8px 14px;border-radius:6px}
  a.btn:hover{filter:brightness(1.1)}
  .back{cursor:pointer;color:var(--accent);font-size:12px;margin-bottom:10px}
  .tt b{font-size:13px}.tt .v{font-family:ui-monospace,monospace}
  @media(max-width:820px){
    html,body{height:auto;overflow:visible}
    body{grid-template-columns:1fr;grid-template-rows:auto auto 50vh auto;
      grid-template-areas:"head" "sub" "map" "panel";height:auto;min-height:100vh}
    #map{min-height:50vh}
    aside{border-left:none;border-top:1px solid var(--line);max-height:none;overflow:visible}
    .detail{overflow:visible}
    .strip{flex-wrap:wrap}
    .summary{display:flex;width:100%;justify-content:space-between;margin-top:6px}}
</style>
</head>
<body>
<header>
  <h1>NC Count Stations</h1>
  <span class="sub">Continuous traffic volume · 15-minute resolution</span>
  <span class="gen" id="gen"></span>
</header>
<div class="strip">
  <div class="datebox">
    <button class="nav-btn" id="dprev">‹</button>
    <input type="date" id="date">
    <button class="nav-btn" id="dnext">›</button>
    <span id="dow" style="color:var(--ink);font-size:13px;font-weight:600;min-width:34px;margin-left:2px"></span>
    <button class="play" id="play" title="Animate through dates">▶</button>
  </div>
  <input type="range" id="slider" min="0" max="0" value="0">
  <div class="summary" id="summary"></div>
</div>
<div id="map"></div>
<aside>
  <div class="filters">
    <div class="row"><label>County</label><select id="fCounty"></select></div>
    <div class="row"><label>Route</label><select id="fRoute"></select></div>
    <div class="row"><label>Type</label>
      <select id="fType"><option value="">All areas</option>
        <option value="U">Urban</option><option value="R">Rural</option></select></div>
    <div class="count" id="count"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="detail" id="detail"><div class="unusual" id="unusual"></div></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const SLABEL=['Well below','Below','Typical','Above','Well above','Holiday','No data'];
const SVAR=['--s0','--s1','--s2','--s3','--s4','--s5','--s6'];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=n=>n==null?'—':n.toLocaleString('en-US');
const map=L.map('map',{zoomControl:true,attributionControl:false}).setView([35.5,-79.2],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);
const legend=document.getElementById('legend');
[4,3,2,1,0,5,6].forEach(k=>{const s=document.createElement('span');
  s.innerHTML=`<span class="dot" style="background:${css(SVAR[k])}"></span>${SLABEL[k]}`;legend.appendChild(s);});
let ALL=[],MARKERS={},DATES=[],curIdx=0,idxByDay={},selected=null,timer=null;
fetch('data/stations.json').then(r=>r.json()).then(data=>{
  document.getElementById('gen').textContent='updated '+(data.generated||'').replace('T',' ').slice(0,16);
  ALL=data.stations.filter(s=>s.lat!=null&&s.lon!=null);
  ALL.forEach(s=>{s._by={};(s.day_status||[]).forEach(([d,v,c,h,p])=>s._by[d]=[v,c,h,p]);});
  const set=new Set();ALL.forEach(s=>(s.day_status||[]).forEach(r=>set.add(r[0])));
  DATES=[...set].sort();DATES.forEach((d,i)=>idxByDay[d]=i);curIdx=DATES.length-1;
  fill('fCounty',[...new Set(ALL.map(s=>s.county).filter(Boolean))].sort(),'All counties');
  fill('fRoute',[...new Set(ALL.map(s=>s.route).filter(Boolean))].sort(),'All routes');
  ALL.forEach(s=>{const m=L.circleMarker([s.lat,s.lon],{radius:8,weight:1.5,color:'#e6edf3',fillOpacity:1});
    m.on('click',()=>{selectStation(s);map.setView([s.lat,s.lon],Math.max(map.getZoom(),11));});MARKERS[s.local_id]=m;m.addTo(map);});
  const b=ALL.map(s=>[s.lat,s.lon]);if(b.length)map.fitBounds(b,{padding:[40,40]});
  const sl=document.getElementById('slider');sl.max=DATES.length-1;sl.value=curIdx;
  document.getElementById('date').min=DATES[0];document.getElementById('date').max=DATES[DATES.length-1];
  sl.addEventListener('input',()=>setDate(+sl.value));
  document.getElementById('date').addEventListener('change',e=>{if(idxByDay[e.target.value]!=null)setDate(idxByDay[e.target.value]);});
  document.getElementById('dprev').onclick=()=>setDate(curIdx-1);
  document.getElementById('dnext').onclick=()=>setDate(curIdx+1);
  document.getElementById('play').onclick=togglePlay;
  ['fCounty','fRoute','fType'].forEach(id=>document.getElementById(id).addEventListener('change',render));
  setDate(curIdx);
});
function fill(id,vals,lab){document.getElementById(id).innerHTML=`<option value="">${lab}</option>`+vals.map(v=>`<option>${v}</option>`).join('');}
function setDate(i){curIdx=Math.max(0,Math.min(DATES.length-1,i));
  document.getElementById('slider').value=curIdx;
  const d=DATES[curIdx];
  document.getElementById('date').value=d;
  const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T00:00').getDay()];
  document.getElementById('dow').textContent=wd;
  render();}
function passesFilter(s){const c=document.getElementById('fCounty').value,r=document.getElementById('fRoute').value,t=document.getElementById('fType').value;
  return (!c||s.county===c)&&(!r||s.route===r)&&(!t||s.rururb===t);}
function render(){
  const day=DATES[curIdx],counts=[0,0,0,0,0,0,0];let shown=0;const unusual=[];
  ALL.forEach(s=>{const m=MARKERS[s.local_id];
    if(!passesFilter(s)){if(map.hasLayer(m))map.removeLayer(m);return;}
    if(!map.hasLayer(m))m.addTo(map);shown++;
    const rec=s._by[day],code=rec?rec[1]:6,vol=rec?rec[0]:null,hol=rec?rec[2]:0,p=rec?rec[3]:null;counts[code]++;
    m.setStyle({fillColor:css(SVAR[code])});m.unbindTooltip();
    const pStr=p!=null?` (${p>0?'+':''}${p}%)`:'';
    m.bindTooltip(`<div class="tt"><b>${s.name}</b><br>${day} · <span class="v">${fmt(vol)}</span>${pStr} · ${SLABEL[code]}${hol?' · 🎉 Holiday':''}</div>`,{direction:'top',offset:[0,-6]});
    if(rec&&code!==2&&code!==6)unusual.push({s,code,p});});
  document.getElementById('summary').innerHTML=
    `<span><i style="background:${css('--s4')}"></i><b>${counts[3]+counts[4]}</b> above</span>`+
    `<span><i style="background:${css('--s2')}"></i><b>${counts[2]}</b> typical</span>`+
    `<span><i style="background:${css('--s1')}"></i><b>${counts[0]+counts[1]}</b> below</span>`+
    (counts[5]?`<span><i style="background:${css('--s5')}"></i><b>${counts[5]}</b> holiday</span>`:'');
  document.getElementById('count').textContent=`${shown} of ${ALL.length} stations`;
  if(!selected)showUnusual(unusual,day);
}
function showUnusual(list,day){
  list.sort((a,b)=>Math.abs((b.p??0))-Math.abs((a.p??0)));
  const top=list.slice(0,10),el=document.getElementById('detail');
  el.innerHTML=`<div class="unusual"><h4>Furthest from typical · ${day}</h4>`+
    (top.length?top.map(u=>`<div class="urow" data-id="${u.s.local_id}">
      <span class="dot" style="background:${css(SVAR[u.code])}"></span>
      <span class="nm">${u.s.name}</span>
      <span class="pc" style="color:${css(SVAR[u.code])}">${u.p!=null?(u.p>0?'+':'')+u.p+'%':SLABEL[u.code]}</span></div>`).join('')
      :'<div class="empty">Every station is near its typical volume for this date.</div>')+'</div>';
  el.querySelectorAll('.urow').forEach(r=>r.onclick=()=>{
    const s=ALL.find(x=>x.local_id===r.dataset.id);selectStation(s);
    map.setView([s.lat,s.lon],Math.max(map.getZoom(),11));});
}
function selectStation(s){
  selected=s;const day=DATES[curIdx],rec=s._by[day],code=rec?rec[1]:6,color=css(SVAR[code]);
  const vol=rec?rec[0]:null,hol=rec?rec[2]:0,pTyp=rec?rec[3]:null;
  let cmp='';
  if(vol!=null&&s.base_aadt){const p=(vol-s.base_aadt)/s.base_aadt*100;
    cmp=`· <span class="${p>=0?'up':'down'}">${p>=0?'+':''}${p.toFixed(0)}% vs AADT</span>`;}
  const typStr=pTyp!=null?` · ${pTyp>0?'+':''}${pTyp}% vs typical`:'';
  document.getElementById('detail').innerHTML=`
    <div class="back" id="backList">← Back to list</div>
    <div class="st-name">${s.name||s.local_id}</div>
    <div class="st-meta">${s.county?'<b>'+s.county+' County</b> · ':''}${s.route||''}
      ${s.rururb==='U'?'· Urban':s.rururb==='R'?'· Rural':''} · station <b>${s.local_id}</b></div>
    <div class="headline">
      <div class="big" style="color:${color}">${fmt(vol)}</div>
      <div class="status" style="color:${color}">${SLABEL[code]}${hol?' 🎉':''}</div>
    </div>
    <div class="vs">
      <div>Date: <span class="num">${day}</span>${typStr}</div>
      <div>AADT · ${s.base_year}: <span class="num">${fmt(s.base_aadt)}</span> ${cmp}</div>
      ${s.current_ytd?`<div>${s.current_year} year-to-date est: <span class="num">${fmt(s.current_ytd)}</span></div>`:''}
    </div>
    <a class="btn" href="station.html?id=${s.local_id}&date=${day}">Explore more data →</a>`;
  document.getElementById('backList').onclick=()=>{selected=null;render();};
}
function togglePlay(){const btn=document.getElementById('play');
  if(timer){clearInterval(timer);timer=null;btn.textContent='▶';return;}
  if(curIdx>=DATES.length-1)setDate(0);
  btn.textContent='❚❚';
  timer=setInterval(()=>{if(curIdx>=DATES.length-1){clearInterval(timer);timer=null;btn.textContent='▶';return;}setDate(curIdx+1);},130);
}
</script>
</body>
</html>
